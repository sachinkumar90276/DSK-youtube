name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure writable Android SDK directory
        run: |
          SDK_DIR="${RUNNER_TEMP}/android-sdk"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null

      - name: Validate Android SDK configuration
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
          test -f "$ANDROID_HOME/platforms/android-36.1/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate Gradle configuration
        run: |
          test -f gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          gradle --version

      - name: Configure build environment
        env:
          YOUTUBE_API_KEY_SECRET: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY_SECRET" ]; then
            printf 'YOUTUBE_API_KEY=%s\n' "$YOUTUBE_API_KEY_SECRET" > .env
            echo "YOUTUBE_API_KEY configured from GitHub Secrets."
          else
            echo "YOUTUBE_API_KEY secret not set; falling back to .env.example."
          fi

      - name: Resolve dependencies
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath --console=plain >/dev/null
          gradle :app:prepareRobolectricSdkJars --console=plain

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Compile Android application
        run: gradle :app:compileDebugSources --console=plain

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Verify Debug APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          echo "Verified APK path: $APK_PATH"

      - name: Upload APK as GitHub Actions Artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: dsk-youtube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Print APK Artifact location
        run: |
          echo "Artifact name: dsk-youtube-debug-apk"
          echo "Artifact ID: ${{ steps.upload-apk.outputs.artifact-id }}"
          echo "Artifact URL: ${{ steps.upload-apk.outputs.artifact-url }}"
